<script>
(()=>{'use strict';let data=null,lastHeight=0,lastWidth=innerWidth,eventId=0,opened=innerWidth>650,toggleTouched=false,layout='scroll',chooserOpen=false;
const root=document.getElementById('root'),searches=new Map(),limits=new Map();
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const fmt=n=>Number(n).toLocaleString('en-US');
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e;}
function button(text,fn,cls){const b=node('button',text,cls);b.type='button';b.addEventListener('click',fn);return b;}
function height(){const h=Math.ceil(root.getBoundingClientRect().height)+4;if(h!==lastHeight){lastHeight=h;send('streamlit:setFrameHeight',{height:h});}}
function request(action,extra={}){root.classList.add('busy');root.setAttribute('aria-busy','true');send('streamlit:setComponentValue',{value:{view:data.view,event:Date.now()+'-'+(++eventId),action,...extra},dataType:'json'});}
function labelInput(text,type){const label=node('label');const input=node('input');input.type=type;label.append(input,node('span',text));return {label,input};}
function hasSelection(g){return g.units.length?Boolean(g.low||g.high):g.options.some(o=>o.checked);}
function renderChooser(){
 const area=node('div',undefined,'category-selection');area.hidden=Boolean(data.kind)&&!chooserOpen;
 const label=node('label','产品类别');label.htmlFor='product-category';
 const select=node('select');select.id='product-category';select.setAttribute('aria-label','选择产品类别');
 const none=node('option','请选择器件品类');none.value='';select.append(none);
 const order=['电容','电阻','电感／磁珠','晶振／时钟','MOS管','二极管','三极管','其他'];
 order.filter(f=>data.categories.some(c=>c.family===f)).forEach(f=>{
  const group=node('optgroup');group.label=f;
  data.categories.filter(c=>c.family===f).forEach(c=>{const option=node('option',(c.kind||'未分类')+'（'+fmt(c.count)+'）');option.value=c.kind;group.append(option);});select.append(group);
 });
 select.value=data.kind||'';select.addEventListener('change',()=>{if(select.value&&select.value!==data.kind)request('kind',{kind:select.value});else{chooserOpen=false;area.hidden=Boolean(data.kind);height();}});area.append(label,select);
 area.append(node('span',data.categories.length+' 个库内品类','category-count'));return area;
}
function group(g){
const section=node('section',undefined,'facet'+(g.units.length?' numeric':''));
section.dataset.field=g.key;section.append(node('h4',g.label));
const box=node('div',undefined,'facet-box');
if(g.units.length){
 const body=node('div',undefined,'numeric-body'),available=node('p','','available');
 const exact=node('input');exact.type='text';exact.inputMode='decimal';exact.placeholder='精确值';exact.setAttribute('aria-label',g.label+'精确值');exact.maxLength=60;
 const low=node('input'),high=node('input');
 [low,high].forEach(i=>{i.type='text';i.inputMode='decimal';i.maxLength=60;});
 low.placeholder='下限';high.placeholder='上限';low.setAttribute('aria-label',g.label+'下限');high.setAttribute('aria-label',g.label+'上限');low.value=g.low;high.value=g.high;
 const unit=node('select');unit.setAttribute('aria-label',g.label+'单位');
 g.units.forEach(([u])=>{const o=node('option',u);o.value=u;unit.append(o);});unit.value=g.unit;
 const error=node('p','','validation');error.setAttribute('role','alert');
 function bounds(){const factor=g.units.find(([u])=>u===unit.value)[1],b=g.bounds?.[0]!=null?g.bounds:g.available;available.textContent='已收录：'+Number((b[0]/factor).toPrecision(8))+' ～ '+Number((b[1]/factor).toPrecision(8))+' '+unit.value;}
 function apply(){
  const l=low.value.trim(),h=high.value.trim(),factor=g.units.find(([u])=>u===unit.value)[1];
  const decimal=/^\+?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/;
  if([l,h].some(v=>v!==''&&(!decimal.test(v)||!Number.isFinite(Number(v)*factor)||Number(v)<0))){error.textContent='请输入大于或等于 0 的有效数字';return;}
  if(l!==''&&h!==''&&Number(l)>Number(h)){error.textContent='下限不能大于上限';return;}
  request('range',{field:g.key,low:l,high:h,unit:unit.value});
 }
 unit.addEventListener('change',bounds);
 exact.addEventListener('input',()=>{low.value=high.value=exact.value;});
 [exact,low,high].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')apply();}));
 if(g.low!==''&&g.low===g.high)exact.value=g.low;
 const row=node('div',undefined,'number-row');row.append(exact,unit);
 const range=node('div',undefined,'number-row');range.append(low,node('span','～'),high);
 const sliders=node('div',undefined,'range-sliders'),sliderLow=node('input'),sliderHigh=node('input');
 const availableBounds=g.bounds?.[0]!=null?g.bounds:g.available;
 [sliderLow,sliderHigh].forEach(s=>{s.type='range';s.min=String(availableBounds[0]);s.max=String(availableBounds[1]);s.step='any';sliders.append(s);});
 sliderLow.setAttribute('aria-label',g.label+'滑块下限');sliderHigh.setAttribute('aria-label',g.label+'滑块上限');
 function syncSliders(){const factor=g.units.find(([u])=>u===unit.value)[1];sliderLow.value=low.value!==''&&Number.isFinite(Number(low.value))?String(Number(low.value)*factor):sliderLow.min;sliderHigh.value=high.value!==''&&Number.isFinite(Number(high.value))?String(Number(high.value)*factor):sliderHigh.max;}
 function slide(changed){const factor=g.units.find(([u])=>u===unit.value)[1];if(Number(sliderLow.value)>Number(sliderHigh.value)){if(changed===sliderLow)sliderLow.value=sliderHigh.value;else sliderHigh.value=sliderLow.value;}low.value=String(Number((Number(sliderLow.value)/factor).toPrecision(12)));high.value=String(Number((Number(sliderHigh.value)/factor).toPrecision(12)));exact.value='';}
 [sliderLow,sliderHigh].forEach(s=>{s.addEventListener('input',()=>slide(s));s.addEventListener('change',apply);});
 [low,high,exact].forEach(i=>i.addEventListener('input',syncSliders));unit.addEventListener('change',syncSliders);
 syncSliders();body.append(sliders,available,row,range,button('应用',apply,'range-apply'),error);bounds();box.append(body);
}else{
 const search=node('input',undefined,'option-search');search.type='search';search.placeholder='查找全部选项';search.setAttribute('aria-label','查找'+g.label+'选项');search.value=searches.get(g.key)||'';
 if(g.options.length>8)box.append(search);
 const options=node('div',undefined,'options');options.setAttribute('aria-label',g.label+'选项');box.append(options);
 function populate(){
  const top=options.scrollTop,q=(searches.get(g.key)||'').toLocaleLowerCase();
  const matching=g.options.filter(o=>o.checked||o.label.toLocaleLowerCase().includes(q));
  const checked=g.options.filter(o=>o.checked),limit=limits.get(g.key)||100;
  const visible=[...checked,...matching.filter(o=>!o.checked).slice(0,Math.max(0,limit-checked.length))];
  options.replaceChildren();
  visible.forEach(o=>{
   const {label,input}=labelInput(o.label,'checkbox');label.className='option'+(!o.count&&!o.checked?' unavailable':'');
   label.dataset.value=o.value;label.dataset.label=o.label;input.checked=o.checked;
   input.disabled=(!o.count&&!o.checked)||(checked.length>=100&&!o.checked);input.setAttribute('aria-label',g.label+'：'+o.label);
   input.addEventListener('change',()=>request('choice',{field:g.key,value:o.value,checked:input.checked}));
   label.append(node('span',fmt(o.count),'count'));options.append(label);
  });
  if(matching.length>visible.length){
   const more=button('显示更多（'+visible.length+' / '+fmt(matching.length)+'）',()=>{limits.set(g.key,limit+100);populate();},'group-clear');
   more.style.width='100%';options.append(more);
  }
  if(!matching.length)options.append(node('p','没有符合的选项','available'));
  options.scrollTop=top;
 }
 search.addEventListener('input',()=>{searches.set(g.key,search.value);limits.set(g.key,100);populate();});
 populate();
}
const clear=button('清除',()=>request('clear_group',{field:g.key}),'group-clear');clear.setAttribute('aria-label','清除'+g.label);clear.disabled=!hasSelection(g);box.append(clear);section.append(box);return section;
}
function render(){
 if(!toggleTouched)opened=innerWidth>650;
 const scroll=root.querySelector('.strip')?.scrollLeft||0;
 const positions=new Map([...root.querySelectorAll('.facet')].map(n=>[n.dataset.field,n.querySelector('.options')?.scrollTop||0]));
 const focused=document.activeElement?.getAttribute('aria-label');
 root.replaceChildren();root.classList.remove('busy');root.removeAttribute('aria-busy');
 const family=data.categories.find(c=>c.kind===data.kind)?.family;
 root.append(node('nav','器件选型'+(family?' / '+family:'')+(data.kind?' / '+data.kind:''),'breadcrumb'));
 const header=node('div',undefined,'category-head');
 header.append(node('h2',data.kind||'器件规格筛选'));
 if(data.kind)header.append(button('更改产品类别',()=>{chooserOpen=!chooserOpen;root.querySelector('.category-selection').hidden=!chooserOpen;height();},'category-change'));
 root.append(header,renderChooser());
 if(!data.kind){root.append(node('p','请选择产品类别，查看对应的规格筛选条件和库内型号。','category-note'));height();return;}
 const head=node('div',undefined,'section-head'),left=node('div',undefined,'section-left');
 const toggle=button(opened?'打开':'关闭',()=>{toggleTouched=true;opened=!opened;body.hidden=!opened;toggle.textContent=opened?'打开':'关闭';toggle.setAttribute('aria-expanded',String(opened));height();},'toggle');
 toggle.setAttribute('aria-label','筛选条件显示状态');toggle.setAttribute('aria-expanded',String(opened));
 left.append(node('h3','筛选条件'),toggle);
 const actions=node('div',undefined,'filter-actions');
 actions.append(button('清除所有条件',()=>{searches.clear();limits.clear();request('clear_all');},'clear-all'));head.append(left,actions);root.append(head);
 const body=node('div',undefined,'panel-body');body.hidden=!opened;
 const layoutArea=node('div',undefined,'layout');layoutArea.append(node('span','更改布局'));
 const layoutToggle=button(layout==='wrap'?'并排显示':'滚动',()=>{layout=layout==='wrap'?'scroll':'wrap';strip.classList.toggle('wrap',layout==='wrap');layoutToggle.textContent=layout==='wrap'?'并排显示':'滚动';layoutToggle.setAttribute('aria-pressed',String(layout==='wrap'));height();},'layout-toggle');
 layoutToggle.setAttribute('aria-label','切换筛选布局');layoutToggle.setAttribute('aria-pressed',String(layout==='wrap'));layoutArea.append(layoutToggle);
 actions.prepend(layoutArea);
 const strip=node('div',undefined,'strip'+(layout==='wrap'?' wrap':''));data.groups.forEach(g=>strip.append(group(g)));body.append(strip);root.append(body);
 const summary=node('div',undefined,'summary');summary.append(node('strong','筛选条件：'));let active=0;
 data.groups.filter(hasSelection).forEach(g=>{active++;const text=g.units.length?g.label+' = '+(g.low||'不限')+' ～ '+(g.high||'不限')+' '+g.unit:g.label+' = '+g.options.filter(o=>o.checked).map(o=>o.label).join('、');summary.append(button(text+' · 移除',()=>request('clear_group',{field:g.key}),'chip'));});
 if(!active)summary.append(node('span','不限'));
 root.append(summary);strip.scrollLeft=scroll;
 root.querySelectorAll('.facet').forEach(n=>{const list=n.querySelector('.options');if(list)list.scrollTop=positions.get(n.dataset.field)||0;});
 if(focused){const target=[...root.querySelectorAll('[aria-label]')].find(n=>n.getAttribute('aria-label')===focused);target?.focus({preventScroll:true});}height();
}
window.addEventListener('message',event=>{
 if(event.source!==parent||event.data?.type!=='streamlit:render')return;
 const value=event.data.args?.payload;if(!value)return;
 const changedKind=data?.kind!==value.kind;
 const next={...value,groups:value.groups.map(g=>({...g,options:g.options?.map(o=>({...o}))}))};
 if(changedKind){chooserOpen=false;searches.clear();limits.clear();}
 data=next;render();
});window.addEventListener('resize',()=>{if(innerWidth!==lastWidth){lastWidth=innerWidth;if(data&&!toggleTouched&&opened!==(innerWidth>650)){render();}else height();}});
 new ResizeObserver(height).observe(root);send('streamlit:componentReady',{apiVersion:1});height();
})();
</script></body></html>
