<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;color:#24364b;background:#fff;font:14px/1.5 Arial,"Microsoft YaHei",sans-serif}button,select,input{font:inherit}button,summary,select{cursor:pointer}button{border:1px solid #b9c8d8;background:white;border-radius:3px;color:#244364;padding:8px 13px;min-height:38px}button:hover:not(:disabled){border-color:#2164bc;background:#f1f6fc}button:disabled{cursor:default;color:#7e8b98;background:#f4f5f7;border-color:#dce2e8}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #1867ce;outline-offset:2px}select{border:1px solid #b9c8d8;padding:7px;background:white;border-radius:3px;color:inherit}.conditions{background:#f4f6f9;border:1px solid #e0e5eb;padding:12px 15px;font-size:13px;color:#4d6178;overflow-wrap:anywhere}.conditions strong{color:#253d58}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:19px 0 14px;flex-wrap:wrap}.heading{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap}.heading h2{margin:0;font-size:25px;font-weight:500;color:#182d45}.count{font-size:13px;color:#52677d}.count b{font-size:20px;font-weight:600;color:#2164bc;margin:0 5px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.primary{background:#2467bb;color:#fff;border-color:#2467bb}.primary:hover:not(:disabled){background:#195aa7;color:#fff}.columns{position:relative}.columns summary{list-style:none;min-height:38px;border:1px solid #b9c8d8;border-radius:3px;padding:8px 13px;color:#244364}.columns[open] summary{border-color:#2164bc}.column-menu{position:absolute;right:0;top:43px;z-index:12;background:#fff;border:1px solid #c5d0dd;box-shadow:0 5px 20px #1b345026;width:245px;max-height:330px;overflow:auto;padding:10px}.column-menu label{display:flex;gap:9px;align-items:center;padding:6px;font-size:13px;cursor:pointer}input[type=checkbox]{width:17px;height:17px;accent-color:#2164bc;cursor:pointer}.strip{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px;font-size:12px;color:#62758a}.page-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.page-controls button{font-size:12px;min-height:32px;padding:4px 10px}.page-controls select{font-size:12px;padding:4px 7px}.scroll{max-width:100%;overflow:auto;max-height:610px;border:1px solid #c3cbd6;scrollbar-color:#8798ab #edf0f4;scrollbar-width:thin;position:relative}table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;min-width:1050px}th,td{border-right:1px solid #d3dae3;border-bottom:1px solid #d3dae3;padding:13px 12px;vertical-align:middle;text-align:center;overflow-wrap:anywhere}th{position:sticky;top:0;z-index:3;background:#edf1f6;color:#20374f;font-size:13px;font-weight:600;height:65px}th:last-child,td:last-child{border-right:0}tbody tr:last-child td{border-bottom:0}tbody tr{background:#fff}tbody tr:nth-child(even){background:#fafbfd}tbody tr:hover{background:#f0f6fe}tbody tr.selected{background:#edf5ff}td{font-size:13px;line-height:1.55;height:67px}.pick{width:42px;position:sticky;left:0;z-index:2;background:inherit;padding:10px 6px}.model{width:205px;position:sticky;left:42px;z-index:2;background:inherit;text-align:left;box-shadow:2px 0 3px #213e5a10}.pick-head,.model-head{z-index:6;background:#edf1f6}.model button{border:0;border-radius:0;background:transparent;color:#185fae;font-size:13px;line-height:1.5;text-align:left;padding:0;min-height:36px;font-weight:600;text-decoration:underline;text-underline-offset:3px;word-break:break-word}.model small{display:block;color:#77879a;font-size:11px;font-weight:400;margin-top:4px}.sort-button{display:block;border:0;padding:0;background:transparent;min-height:36px;width:100%;font-size:13px;font-weight:600;color:inherit;line-height:1.4}.sort-button:hover:not(:disabled){background:transparent;text-decoration:underline}.sort-label{font-size:10px;display:block;color:#2368ba;margin-top:3px;font-weight:400}.unknown{color:#91a0ae}.badge{display:inline-block;padding:3px 8px;border:1px solid #ccd8e7;color:#305d8b;background:#f6f9fd;border-radius:3px;font-size:12px}.footer{padding:10px 0 0;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#6c7f93;flex-wrap:wrap}.busy{opacity:.6;pointer-events:none}dialog{border:1px solid #bdcbdc;border-radius:5px;padding:0;width:calc(100% - 18px);max-width:1150px;max-height:85vh;color:inherit}dialog::backdrop{background:#18314e66}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;background:#f5f7fb;border-bottom:1px solid #d5dee8}.dialog-head h3{margin:0;font-size:18px}.compare-scroll{overflow:auto;max-height:65vh}.compare-table{min-width:650px}.compare-table th{position:static;height:auto;padding:12px}.compare-table th:first-child{width:170px}.compare-table td{text-align:left}.compare-note{padding:10px 16px;margin:0;font-size:12px;color:#698097}.hint{margin:8px 0;color:#486b91;font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.model-head .sort-button{color:#20374f;text-decoration:none;text-align:center}
@media(max-width:650px){body{font-size:13px}.toolbar{padding:14px 0 10px;gap:12px}.heading h2{font-size:22px}.heading{gap:10px}.tools{width:100%;gap:6px}.tools>button,.columns summary{font-size:12px;padding:7px 9px}.strip{align-items:flex-start;flex-direction:column}.page-controls{gap:7px}.scroll{max-height:510px}.model{width:158px;left:34px}.pick{width:34px}.conditions{padding:10px;font-size:12px}th,td{padding:10px 8px}.column-menu{left:0;right:auto}.count b{font-size:18px}.footer{font-size:11px}dialog{max-height:90vh}.compare-table{min-width:600px}}
</style></head><body>
<main id="root" aria-label="器件规格筛选结果"></main>
<dialog id="comparison" aria-label="型号规格对比"><div class="dialog-head"><h3>型号规格对比</h3><button id="close-compare">关闭对比</button></div><div id="comparison-content" class="compare-scroll"></div><p class="compare-note">仅比较本页已选型号；未知参数不视为相同，也不表示可以直接替代。</p></dialog>

<style>
body{color:#333e43;font-family:Arial,"Microsoft YaHei",sans-serif}
.conditions{display:none}.toolbar{background:#f5f5f5;padding:15px 0 0;margin:0;gap:14px;align-items:center}.heading{gap:0;flex:1;min-width:135px}.heading h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.count{font-size:12px;color:#30383c;line-height:1.5}.count b{display:block;margin:0;color:#252c30;font-size:21px;line-height:1.2}.columns summary{border-radius:0;background:#535f62;color:#fff;border:1px solid #535f62;min-height:43px;padding:10px 21px;font-size:12px}.column-menu{left:0;right:auto;top:45px;color:#303c44}.tools{gap:10px}.tools>button{min-height:43px;border-radius:0;font-size:12px;padding:9px 18px}.tools .primary{background:#2164bc;border-color:#2164bc;color:#fff}.compare-trigger{min-width:133px}.tools>button:disabled{background:#e9eaea;border-color:#e9eaea;color:#9da6aa}.page-controls{gap:7px;font-size:11px}.page-controls button{font-size:11px;min-height:32px;padding:3px 8px;border-radius:0}.page-controls select{min-height:34px;padding:6px;border-radius:0;font-size:12px}.strip{margin:0;padding:9px 0 10px;background:#f5f5f5;color:#657175;font-size:10px}.scroll{border-color:#b7bec0;max-height:610px;scrollbar-color:#8b9396 #f1f2f2}th{background:#535f62;color:#fff;border-color:#909a9d;font-size:12px;height:91px;padding:13px 9px;vertical-align:top}.pick-head,.model-head{background:#535f62}.model-head .sort-button,.sort-button{color:#fff;font-size:12px;text-align:left}.sort-button:hover:not(:disabled){color:white}.sort-label{color:#e5effa;font-size:10px}td{background:#fff;border-color:#c1c8cb;padding:14px 11px;font-size:12px;line-height:1.6;height:78px}tbody tr:nth-child(even){background:#fff}tbody tr:hover td{background:#f4f7fa}tbody tr.selected td{background:#e9f2fb}.pick,.model{background:#fff}.pick-head,.model-head{background:#535f62}.model button{font-size:12px;font-weight:500;color:#174c7e}.model small{font-size:10px;color:#71808b}.badge{border:0;border-radius:0;background:#eff1f2;color:#384d59;padding:2px 7px;font-size:11px}.footer{font-size:10px;padding-top:10px}.conditions+ .toolbar{border-top:0}
@media(max-width:650px){.toolbar{gap:10px;padding-top:12px}.columns summary{min-height:38px;padding:8px 12px;font-size:11px}.heading{min-width:110px}.count{font-size:11px}.count b{font-size:19px}.tools{gap:7px;width:100%;flex-wrap:wrap}.tools>button{min-height:38px;font-size:11px;padding:7px 12px}.page-controls{flex-wrap:wrap}.page-controls button{font-size:10px}.scroll{max-height:510px}th{height:78px;font-size:11px}td{font-size:11px;padding:11px 8px}.model button{font-size:11px}.strip{font-size:10px}.compare-trigger{min-width:115px}}
</style>

<style>th,.sort-button,.model-head .sort-button,td,.model button{font-size:13px}.model small{font-size:11px}.strip,.footer{font-size:11px}@media(max-width:650px){th,.sort-button,.model-head .sort-button,td,.model button{font-size:12px}}</style>
<script>
(()=>{'use strict';
let data=null,visible=new Set(),picked=new Set(),eventNumber=0,lastHeight=0,lastWidth=window.innerWidth;
const root=document.getElementById('root'),dialog=document.getElementById('comparison');
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
function height(){const h=Math.min(1100,Math.ceil(root.getBoundingClientRect().height)+3);if(h!==lastHeight){lastHeight=h;send('streamlit:setFrameHeight',{height:h});}}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n;}
function button(text,fn,cls){const b=node('button',text,cls);b.type='button';b.addEventListener('click',fn);return b;}
function request(action,extra){root.classList.add('busy');send('streamlit:setComponentValue',{value:{action,view:data.view,event:Date.now()+'-'+(++eventNumber),...extra},dataType:'json'});}
const count=n=>Number(n).toLocaleString('en-US');
function shown(){return data.columns.filter(c=>visible.has(c.key));}
function tableWidth(){return (window.innerWidth<650?34:42)+shown().reduce((n,c)=>n+(c.key==='型号'?(window.innerWidth<650?158:205):c.key==='品牌'?145:/条件|动态|用途|温度/.test(c.label)?175:126),0);}
function updateColumns(){root.querySelectorAll('[data-column]').forEach(n=>{n.hidden=!visible.has(n.dataset.column);});root.querySelector('.scroll table').style.minWidth=tableWidth()+'px';height();}
function updateSelection(){root.querySelectorAll('tbody .pick input').forEach(n=>{n.checked=picked.has(n.dataset.rowId);n.disabled=picked.size>=4&&!n.checked;n.closest('tr').classList.toggle('selected',n.checked);});const b=root.querySelector('.compare-trigger');b.textContent='对比已选（'+picked.size+'/4）';b.disabled=picked.size<2;}
function openModel(row){request('match',{id:row.id});}
function csv(){const cols=shown();const esc=x=>{let s=String(x??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const lines=[cols.map(c=>esc(c.label)).join(','),...data.rows.map(r=>cols.map(c=>esc(r[c.key])).join(','))];const url=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=node('a');a.href=url;a.download='器件筛选_'+data.kind+'_第'+data.page+'页.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function compare(){const rows=data.rows.filter(r=>picked.has(r.id));const t=node('table',undefined,'compare-table');const head=node('tr');head.append(node('th','参数'));rows.forEach(r=>head.append(node('th',r['型号'])));const thead=node('thead');thead.append(head);t.append(thead);const body=node('tbody');data.columns.filter(c=>c.key!=='型号').forEach(c=>{const tr=node('tr');tr.append(node('th',c.label));rows.forEach(r=>{const td=node('td',r[c.key]||'未提供');if(!r[c.key]||r[c.key]==='未提供')td.className='unknown';tr.append(td);});body.append(tr);});t.append(body);document.getElementById('comparison-content').replaceChildren(t);dialog.showModal();}
function render(){
root.classList.remove('busy');root.replaceChildren();
const conditions=node('div',undefined,'conditions');conditions.append(node('strong','已选条件：'),document.createTextNode(data.condition));root.append(conditions);
const toolbar=node('div',undefined,'toolbar'),heading=node('div',undefined,'heading');heading.append(node('h2','检索结果'));const amount=node('div',undefined,'count');amount.append(document.createTextNode('找到 '),node('b',count(data.total)),document.createTextNode(' 个库内型号'));heading.append(amount);toolbar.append(heading);
const tools=node('div',undefined,'tools'),columns=node('details',undefined,'columns');columns.append(node('summary','显示列'));const menu=node('div',undefined,'column-menu');data.columns.forEach(c=>{const label=node('label'),input=node('input');input.type='checkbox';input.checked=visible.has(c.key);input.disabled=['型号','品牌'].includes(c.key);input.setAttribute('aria-label','显示列 '+c.label);input.addEventListener('change',()=>{if(input.checked)visible.add(c.key);else visible.delete(c.key);updateColumns();});label.append(input,document.createTextNode(c.label));menu.append(label);});columns.append(menu);columns.addEventListener('toggle',height);toolbar.insertBefore(columns,heading);
const compareButton=button('对比已选（'+picked.size+'/4）',compare,'compare-trigger');compareButton.disabled=picked.size<2;tools.append(compareButton,button('产品规格（本页CSV）',csv,'primary'));toolbar.append(tools);root.append(toolbar);
const strip=node('div',undefined,'strip');strip.append(node('span','勾选本页 2–4 个型号对比；点击型号可查看匹配。'));
const pager=node('div',undefined,'page-controls');const size=node('select');size.setAttribute('aria-label','每页型号数');[20,50,100].forEach(n=>{const op=node('option',n+' 条／页');op.value=n;op.selected=n===data.size;size.append(op);});size.addEventListener('change',()=>request('size',{size:Number(size.value)}));pager.append(size,node('span',data.page+' / '+data.pages+' 页'));const prev=button('上一页',()=>request('page',{page:data.page-1})),next=button('下一页',()=>request('page',{page:data.page+1}));prev.disabled=data.page===1;next.disabled=data.page===data.pages;pager.append(prev,next);toolbar.insertBefore(pager,tools);root.append(strip);
const scroll=node('div',undefined,'scroll');scroll.tabIndex=0;scroll.setAttribute('aria-label','规格表，可横向滚动');const table=node('table');table.setAttribute('aria-label',data.kind+' 产品规格表');
const cols=data.columns,colgroup=node('colgroup');const cp=node('col');cp.style.width=window.innerWidth<650?'34px':'42px';colgroup.append(cp);cols.forEach(c=>{const co=node('col');co.dataset.column=c.key;co.hidden=!visible.has(c.key);co.style.width=c.key==='型号'?(window.innerWidth<650?'158px':'205px'):c.key==='品牌'?'145px':/条件|动态|用途|温度/.test(c.label)?'175px':'126px';colgroup.append(co);});table.append(colgroup);table.style.minWidth=tableWidth()+'px';
const thead=node('thead'),hr=node('tr');const selectHead=node('th',undefined,'pick pick-head');selectHead.scope='col';selectHead.append(node('span','对比','sr-only'));hr.append(selectHead);cols.forEach(c=>{const th=node('th',undefined,c.key==='型号'?'model model-head':undefined);th.dataset.column=c.key;th.hidden=!visible.has(c.key);th.scope='col';const sort=button(c.label,()=>request('sort',{column:c.key,desc:data.sort===c.key?!data.desc:false}),'sort-button');sort.title='按'+c.label+'排序（所有筛选结果）';if(data.sort===c.key){th.setAttribute('aria-sort',data.desc?'descending':'ascending');sort.append(node('span',data.desc?'降序':'升序','sort-label'));}th.append(sort);hr.append(th);});thead.append(hr);table.append(thead);
const body=node('tbody');data.rows.forEach(row=>{const tr=node('tr');if(picked.has(row.id))tr.className='selected';const tdPick=node('td',undefined,'pick');const box=node('input');box.type='checkbox';box.dataset.rowId=row.id;box.checked=picked.has(row.id);box.disabled=picked.size>=4&&!box.checked;box.setAttribute('aria-label','对比 '+row['型号']);box.addEventListener('change',()=>{if(box.checked)picked.add(row.id);else picked.delete(row.id);updateSelection();});tdPick.append(box);tr.append(tdPick);
cols.forEach(c=>{const td=node('td',undefined,c.key==='型号'?'model':undefined);td.dataset.column=c.key;td.hidden=!visible.has(c.key);const value=row[c.key]||'未提供';if(c.key==='型号'){td.append(button(value,()=>openModel(row)),node('small','查看价格与替代型号'));}else if(value==='未提供'){td.textContent=value;td.className='unknown';}else if(['_size','封装代码','极性','生产状态'].includes(c.key)){td.append(node('span',value,'badge'));}else td.textContent=value;td.title=value;tr.append(td);});body.append(tr);});table.append(body);scroll.append(table);root.append(scroll);
const footer=node('div',undefined,'footer');footer.append(node('span','本页 '+data.rows.length+' 条 · 第 '+count((data.page-1)*data.size+1)+'–'+count(Math.min(data.page*data.size,data.total))+' 条／共 '+count(data.total)+' 条'),node('span','表头可排序 · 型号列固定 · 数量不是库存'));root.append(footer);height();
}
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.type!=='streamlit:render')return;const next=event.data.args?.payload;if(!next?.view||!Array.isArray(next.rows))return;const changed=data?.view!==next.view,newKind=data?.kind!==next.kind;data=next;if(changed){if(newKind)visible=new Set(data.columns.filter(c=>c.visible).map(c=>c.key));picked.clear();if(dialog.open)dialog.close();}render();});
document.getElementById('close-compare').addEventListener('click',()=>dialog.close());window.addEventListener('resize',()=>{if(data&&lastWidth!==window.innerWidth){lastWidth=window.innerWidth;render();}});new ResizeObserver(height).observe(root);send('streamlit:componentReady',{apiVersion:1});height();
})();
</script></body></html>
