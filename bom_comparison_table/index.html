<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#183453;background:white}
.compare-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;font-size:14px;min-height:38px}
.compare-toolbar button{border:1px solid #bdd0ee;border-radius:6px;background:white;color:#244b7a;padding:8px 14px;font:inherit;cursor:pointer}
.compare-toolbar #compare-run{margin-left:auto;background:#1553ed;border-color:#1553ed;color:white;font-weight:600;min-height:40px}
.compare-toolbar #compare-run:disabled{background:#edf1f7;border-color:#dce3ed;color:#7e8ca0;cursor:default}
#compare-selection{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#compare-selection button{background:#eef4ff;padding:5px 9px;font-size:13px}
#compare-message{color:#647a93;font-size:13px}
.compare-result{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-basis:100%;padding:8px 0 2px;border-top:1px solid #e3eaf4;font-size:13px}
.compare-result[hidden],#compare-empty[hidden],#compare-pages[hidden]{display:none}
#compare-summary{color:#167052;font-weight:600}
#compare-summary[data-level="warning"]{color:#925600}
.compare-filter{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-left:auto}
.compare-filter input{width:17px;height:17px;accent-color:#1553ed}
#compare-pages{display:inline-flex;align-items:center;gap:8px}
#compare-pages button{padding:4px 8px;font-size:12px}
#compare-empty{padding:16px;color:#60748f;font-size:14px;border:1px solid #e3eaf4;border-top:0}
.result-table td.compare-cell-issue{background:#fff4dc!important;box-shadow:inset 0 -2px #dda44e}
.compare-note{margin-top:4px;white-space:normal;font-size:12px;color:#805213}
.compare-note summary{cursor:pointer;font-weight:600}
.compare-note p{margin:6px 0 2px;line-height:1.5;overflow-wrap:anywhere;max-width:340px}
.result-table th .compare-heading{display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding:3px 4px 3px 0;white-space:nowrap}
.compare-heading input{width:18px;height:18px;margin:0;accent-color:#1553ed;cursor:pointer;flex:none}
.result-table th.compare-selected{background:#e4eeff!important;box-shadow:inset 0 -3px #1553ed}
.result-table th .compare-heading:focus-within{outline:2px solid #1553ed;outline-offset:2px}
.result-table th .col-resizer{position:absolute;right:0;top:0;width:7px;height:100%;cursor:col-resize}
@media(max-width:600px){.compare-toolbar{gap:8px}.compare-toolbar #compare-run{padding:8px 12px}#compare-selection{width:100%;order:3}}
</style></head>
<body><div class="compare-toolbar" aria-label="型号比对操作栏">
<span id="compare-message" role="status">勾选两个栏位</span>
<div id="compare-selection"></div>
<button id="compare-run" type="button" disabled>型号比对</button>
<div id="compare-result" class="compare-result" hidden>
<span id="compare-summary" role="status"></span>
<label class="compare-filter"><input id="compare-issues" type="checkbox">仅显示不一致和缺失</label>
<span id="compare-pages" hidden><button id="compare-prev" type="button">上一组差异</button><span id="compare-page"></span><button id="compare-next" type="button">下一组差异</button></span>
</div></div><div id="table-root"></div><div id="compare-empty" role="status" hidden></div>
<script>
(() => {
  const root=document.getElementById('table-root');
  const toolbar=document.querySelector('.compare-toolbar');
  const selection=document.getElementById('compare-selection');
  const message=document.getElementById('compare-message');
  const run=document.getElementById('compare-run');
  const result=document.getElementById('compare-result'),summary=document.getElementById('compare-summary');
  const filter=document.getElementById('compare-issues'),empty=document.getElementById('compare-empty');
  const pages=document.getElementById('compare-pages'),pageLabel=document.getElementById('compare-page');
  const prev=document.getElementById('compare-prev'),next=document.getElementById('compare-next');
  let revision='',selected=[],submitted=[],options=[],lastHtml='',hostDisabled=false;
  let report=null,pending=false,lastRequest=0,requestCounter=0,error='';
  const expandedRows=new Set();
  const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},window.location.origin);
  function height(){
    const wrap=root.querySelector('.bom-result-table-wrap');
    if(wrap){
      const rows=Array.from(wrap.querySelectorAll('tbody tr')).slice(0,10);
      const head=wrap.querySelector('thead');
      const rowsHeight=rows.reduce((sum,row)=>sum+row.getBoundingClientRect().height,0);
      const overflow=wrap.scrollWidth>wrap.clientWidth+1?18:0;
      wrap.style.maxHeight=Math.ceil((head?head.getBoundingClientRect().height:0)+rowsHeight+overflow+2)+'px';
    }
    send('streamlit:setFrameHeight',{height:Math.ceil(toolbar.getBoundingClientRect().height+root.getBoundingClientRect().height+empty.getBoundingClientRect().height+24)});
  }
  function paintReport(){
    const rows=Array.from(root.querySelectorAll('tbody tr'));
    rows.forEach(row=>{
      row.querySelectorAll('.compare-note').forEach(note=>{
        if(note.open)expandedRows.add(note.dataset.rowKey);
        else expandedRows.delete(note.dataset.rowKey);
        note.remove();
      });
      row.querySelectorAll('.compare-cell-issue').forEach(cell=>cell.classList.remove('compare-cell-issue'));
    });
    const active=report&&selected.join('|')===report.columns.join('|')&&!pending;
    result.hidden=!active;empty.hidden=true;
    if(!active)return;
    summary.textContent='全表 '+report.total+' 行 · 一致 '+report.same+' · 不一致 '+report.different+' · 缺失 '+report.missing;
    summary.dataset.level=report.different||report.missing?'warning':'success';
    filter.checked=report.issues_only;filter.disabled=hostDisabled||!report.can_filter;
    pages.hidden=!report.issues_only||report.page_count<=1;
    pageLabel.textContent='差异 '+report.page+' / '+report.page_count+' 页';
    prev.disabled=hostDisabled||report.page<=1;next.disabled=hostDisabled||report.page>=report.page_count;
    const marked=options.map((option,index)=>report.columns.includes(option.key)?index:-1).filter(index=>index>=0);
    const noteColumn=marked.find(index=>options[index].source==='matched')??marked[marked.length-1];
    rows.forEach((row,index)=>{
      const item=report.rows[index];
      if(!item||item.status==='一致')return;
      marked.forEach(column=>row.children[column]?.classList.add('compare-cell-issue'));
      const cell=row.children[noteColumn];
      if(!cell)return;
      const details=document.createElement('details');details.className='compare-note';
      details.dataset.rowKey=report.request+'|'+item.row_number;
      details.open=expandedRows.has(details.dataset.rowKey);
      details.ontoggle=()=>{
        if(details.open)expandedRows.add(details.dataset.rowKey);else expandedRows.delete(details.dataset.rowKey);
        height();
      };
      const title=document.createElement('summary');title.textContent='原表第 '+item.row_number+' 行 · '+item.status;
      const note=document.createElement('p');note.textContent=item.note;
      details.append(title,note);cell.append(details);
    });
    if(report.issues_only&&!rows.length){
      empty.hidden=false;empty.textContent='整张工作表没有不一致或缺失型号。取消“仅显示不一致和缺失”可查看全部物料。';
    }
  }
  function sync(){
    root.querySelectorAll('input[data-compare-key]').forEach(input=>{
      input.checked=selected.includes(input.dataset.compareKey);
      input.disabled=hostDisabled||(!input.checked&&selected.length>=2);
      input.closest('th').classList.toggle('compare-selected',input.checked);
    });
    selection.replaceChildren();
    selected.forEach(key=>{
      const option=options.find(item=>item.key===key);
      if(!option)return;
      const remove=document.createElement('button');
      remove.type='button';remove.textContent=option.label+' ×';
      remove.setAttribute('aria-label','取消勾选 '+option.label);
      remove.disabled=hostDisabled;
      remove.onclick=()=>{selected=selected.filter(value=>value!==key);sync();};
      selection.append(remove);
    });
    const dirty=selected.join('|')!==submitted.join('|');
    message.textContent=error||(pending?'正在更新比对结果…':selected.length===2?(dirty?'已选 2 栏，点击比对':'已选 2 栏'):('勾选两个栏位（'+selected.length+'/2）'));
    run.disabled=hostDisabled||pending||selected.length!==2;
    paintReport();
    height();
  }
  function installHeaders(){
    root.querySelectorAll('thead th').forEach((th,index)=>{
      const option=options[index];
      if(!option)return;
      const label=document.createElement('label');label.className='compare-heading';
      const input=document.createElement('input');input.type='checkbox';
      input.dataset.compareKey=option.key;
      input.setAttribute('aria-label','勾选 '+option.label);
      const name=document.createElement('span');name.textContent=th.textContent;
      label.append(input,name);th.replaceChildren(label);
      input.onchange=()=>{
        selected=selected.filter(value=>value!==option.key);
        if(input.checked&&selected.length<2)selected.push(option.key);
        sync();
      };
      const handle=document.createElement('span');handle.className='col-resizer';
      handle.setAttribute('aria-hidden','true');th.append(handle);
      handle.onpointerdown=event=>{
        event.preventDefault();event.stopPropagation();
        const start=event.clientX,width=th.getBoundingClientRect().width;
        const col=root.querySelectorAll('colgroup col')[index];
        handle.setPointerCapture(event.pointerId);
        handle.onpointermove=move=>{
          const size=Math.max(88,width+move.clientX-start)+'px';
          for(const node of [th,col])if(node){node.style.width=size;node.style.minWidth=size;node.style.maxWidth=size;}
          const table=th.closest('table');
          const total=Array.from(table.querySelectorAll('colgroup col')).reduce((sum,item)=>sum+parseFloat(item.style.width||0),0);
          table.style.width=total+'px';table.style.minWidth=total+'px';
          height();
        };
        handle.onpointerup=()=>{handle.onpointermove=null;};
        handle.onpointercancel=()=>{handle.onpointermove=null;};
      };
    });
    const table=root.querySelector('table');
    if(!table)return;
    const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
    const cols=Array.from(table.querySelectorAll('colgroup col'));
    let total=0;
    table.querySelectorAll('thead th').forEach((th,index)=>{
      ctx.font='600 14px "Segoe UI", "Microsoft YaHei", sans-serif';
      let width=ctx.measureText(th.textContent.trim()).width+56;
      ctx.font='14px "Segoe UI", "Microsoft YaHei", sans-serif';
      table.querySelectorAll('tbody tr').forEach(row=>{
        const cell=row.children[index];
        if(cell)cell.textContent.split('\n').forEach(line=>{width=Math.max(width,ctx.measureText(line.trim()).width+28);});
      });
      width=Math.ceil(Math.min(560,Math.max(88,width)));
      for(const node of [th,cols[index]])if(node){node.style.width=width+'px';node.style.minWidth=width+'px';node.style.maxWidth=width+'px';}
      total+=width;
    });
    table.style.width=total+'px';table.style.minWidth=total+'px';
  }
  function requestView(issuesOnly=false,page=1){
    submitted=selected.slice();lastRequest=Date.now()+(++requestCounter);pending=true;error='';
    send('streamlit:setComponentValue',{value:{revision,columns:submitted,request:lastRequest,issues_only:issuesOnly,page},dataType:'json'});
    sync();
  }
  run.onclick=()=>{if(!run.disabled)requestView(false,1);};
  filter.onchange=()=>{if(!filter.disabled)requestView(filter.checked,1);};
  prev.onclick=()=>{if(!prev.disabled)requestView(true,report.page-1);};
  next.onclick=()=>{if(!next.disabled)requestView(true,report.page+1);};
  window.addEventListener('message',event=>{
    if(event.source!==window.parent||event.origin!==window.location.origin||event.data?.type!=='streamlit:render')return;
    const args=event.data.args||{};
    hostDisabled=Boolean(event.data.disabled);
    const nextOptions=Array.isArray(args.headers)?args.headers:[];
    const changed=revision!==args.revision;
    if(report?.request!==args.report?.request)expandedRows.clear();
    report=args.report||null;error=args.error||'';
    if(changed){
      revision=args.revision;selected=report?report.columns.slice():[];submitted=selected.slice();
      pending=false;lastRequest=report?.request||0;
    }
    if(error||report?.request===lastRequest)pending=false;
    options=nextOptions;
    const valid=new Set(options.map(item=>item.key));
    selected=selected.filter(key=>valid.has(key)).slice(0,2);
    if(lastHtml!==args.table_html){
      const oldWrap=root.querySelector('.bom-result-table-wrap');
      const oldX=oldWrap?.scrollLeft||0,oldY=oldWrap?.scrollTop||0;
      const doc=new DOMParser().parseFromString(args.table_html||'','text/html');
      root.replaceChildren();
      // Only copy trusted renderer styles and the escaped result-table wrapper.
      // Never execute script blocks from the supplied HTML.
      doc.querySelectorAll('style').forEach(style=>root.append(style.cloneNode(true)));
      const wrap=doc.querySelector('.bom-result-table-wrap');
      if(wrap){wrap.querySelectorAll('script').forEach(script=>script.remove());root.append(wrap);}
      lastHtml=args.table_html;installHeaders();
      if(wrap&&!changed){wrap.scrollLeft=oldX;wrap.scrollTop=oldY;}
    }
    sync();
  });
  new ResizeObserver(height).observe(root);
  root.addEventListener('toggle',height,true);
  window.addEventListener('resize',height);
  send('streamlit:componentReady',{apiVersion:1});
})();
</script></body></html>
